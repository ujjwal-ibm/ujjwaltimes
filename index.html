<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ujjwal Times</title>
    <link href="https://fonts.googleapis.com/css2?family=Fondamento&family=Roboto+Mono&family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="ujjwal-title">The Ujjwal Times</div>
    <div class="ujjwal-date" id="currentDate"></div>

    <!-- Filter Section -->
    <div class="filters">
        <div class="filter-group">
            <h3>Filter by Source</h3>
            <div id="sourceFilters"></div>
        </div>
        <div class="filter-group">
            <h3>Filter by Category</h3>
            <div id="categoryFilters"></div>
        </div>
    </div>

    <!-- News Columns -->
    <div class="ujjwal-columns" id="newsColumns">
        <!-- News articles will be populated here by JavaScript -->
    </div>

    <div class="ujjwal-footer">The Ujjwal Times</div>

    <script src="script.js"></script>
</body>
</html>
