<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ebeae7">
    <title>The Ujjwal Times</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fondamento&family=Playfair+Display:wght@700;900&family=Roboto+Mono&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Theme Switcher -->
    <div class="theme-switcher" role="radiogroup" aria-label="Select colour theme">
        <button type="button" class="theme-btn" data-theme-value="light" role="radio" aria-checked="true" title="Light">
            <span class="theme-dot dot-light"></span>
            <span class="theme-label">Light</span>
        </button>
        <button type="button" class="theme-btn" data-theme-value="dark" role="radio" aria-checked="false" title="Dark">
            <span class="theme-dot dot-dark"></span>
            <span class="theme-label">Dark</span>
        </button>
        <button type="button" class="theme-btn" data-theme-value="colorful" role="radio" aria-checked="false" title="Colorful">
            <span class="theme-dot dot-colorful"></span>
            <span class="theme-label">Colorful</span>
        </button>
    </div>

    <header class="ujjwal-header">
        <div class="ujjwal-title">The Ujjwal Times</div>
        <div class="ujjwal-date" id="currentDate"></div>
    </header>

    <!-- Toggle Button for Filters -->
    <button id="filterToggle" onclick="toggleFilters()">Show Filters</button>

    <!-- Collapsible Filter Section -->
    <div class="filters" id="filterSection" style="display: none;">
        <div class="filter-group">
            <h3>Filter by Source</h3>
            <div id="sourceFilters"></div>
        </div>
        <div class="filter-group">
            <h3>Filter by Category</h3>
            <div id="categoryFilters"></div>
        </div>
    </div>

    <!-- News Columns -->
    <div class="ujjwal-columns" id="newsColumns">
        <!-- News articles will be populated here by JavaScript -->
    </div>

    <div class="ujjwal-footer">The Ujjwal Times</div>

    <!-- Article Expand Modal -->
    <div class="article-modal" id="articleModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="article-modal-backdrop" data-close></div>
        <article class="article-modal-content" role="document">
            <button class="article-modal-close" type="button" data-close aria-label="Close article">&times;</button>
            <div class="modal-category" id="modalCategory"></div>
            <h2 class="modal-title" id="modalTitle"></h2>
            <img class="modal-image" id="modalImage" alt="" hidden>
            <div class="modal-description" id="modalDescription"></div>
            <a class="modal-link" id="modalLink" href="#" target="_blank" rel="noopener noreferrer">
                Read full article
                <span class="modal-link-arrow" aria-hidden="true">&rarr;</span>
            </a>
            <div class="modal-source" id="modalSource"></div>
        </article>
    </div>

    <script src="script.js"></script>
</body>
</html>
